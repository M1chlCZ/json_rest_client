name: json_rest_client
description: >-
  A small, dependency-light JSON HTTP client with typed exceptions,
  pluggable auth token storage, user-agent injection, and
  refresh-on-401 retry with a single-flight refresh lock.
version: 0.1.0
repository: https://github.com/M1chlCZ/Rocketbot-App-New/tree/main/packages/json_rest_client
issue_tracker: https://github.com/M1chlCZ/Rocketbot-App-New/issues
topics:
  - http
  - rest
  - json
  - api
  - client
environment:
  sdk: ^3.11.0
dependencies:
  http: ^1.6.0
dev_dependencies:
  lints: ^6.1.0
  test: ^1.32.0
